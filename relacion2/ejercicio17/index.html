<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 17 · Invertir nombre y apellido</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecera">
    <a class="volver" href="../index.html">← Índice de ejercicios</a>
    <p class="etiqueta">Ejercicio 17</p>
    <h1>Invertir nombre y apellido</h1>
  </header>

  <main class="contenedor">
    <section class="enunciado" aria-label="Enunciado">
      <p>Dados un nombre y un apellido, crea la expresión regular necesaria para mostrarlos en orden inverso y separados por una coma. Por ejemplo, «John Smith» debe convertirse en «Smith, John».</p>
    </section>

    <section class="tarjeta">
      <div class="campo">
        <label for="nombre-completo">Nombre y apellido</label>
        <input id="nombre-completo" type="text" value="John Smith" autocomplete="off">
      </div>
      <div class="acciones">
        <button type="button" id="btn-invertir">Invertir</button>
      </div>
      <h2 class="subtitulo">Resultado</h2>
      <div id="resultado" class="salida resultado-grande" aria-live="polite"></div>
      <p class="nota">Expresión regular usada: <code id="regex">—</code></p>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>

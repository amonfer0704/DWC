<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventana secundaria</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecera">
    <p class="etiqueta">Ejercicio 13</p>
    <h1>Ventana secundaria</h1>
  </header>

  <main class="contenedor">
    <section class="tarjeta">
      <div class="campo">
        <label for="campo-secundaria">Mensaje para la principal</label>
        <input id="campo-secundaria" type="text" autocomplete="off">
      </div>
      <div class="acciones">
        <button type="button" id="btn-enviar">Enviar a la principal</button>
        <button type="button" id="btn-cerrar" class="secundario">Cerrar esta ventana</button>
      </div>

      <h3>Recibido de la principal</h3>
      <div id="recibido" class="salida" aria-live="polite">Sin mensajes.</div>
    </section>
  </main>

  <script src="script-secundaria.js" defer></script>
</body>
</html>

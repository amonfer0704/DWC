<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 5 · Calculadora de edad</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecera">
    <a class="volver" href="../index.html">← Índice de ejercicios</a>
    <p class="etiqueta">Ejercicio 5</p>
    <h1>Calculadora de edad</h1>
  </header>

  <main class="contenedor">
    <section class="enunciado" aria-label="Enunciado">
      <p><strong>Calculadora de Edad:</strong> calcula la edad exacta en años, días, horas y minutos de una persona. Maneja el caso especial cuando ya ha llegado el cumpleaños en el año actual.</p>
    </section>

    <section class="tarjeta">
      <div class="campo">
        <label for="nacimiento">Fecha y hora de nacimiento</label>
        <input id="nacimiento" type="datetime-local">
      </div>
      <div class="acciones">
        <button type="button" id="btn-calcular">Calcular edad</button>
        <button type="button" id="btn-limpiar" class="secundario">Limpiar</button>
      </div>
      <p id="mensaje" class="mensaje" hidden></p>
    </section>

    <section class="tarjeta" aria-live="polite">
      <h2>Edad exacta</h2>
      <div class="cuadricula-datos">
        <div class="dato"><span class="valor" id="anios">—</span><span class="nombre">años</span></div>
        <div class="dato"><span class="valor" id="dias">—</span><span class="nombre">días</span></div>
        <div class="dato"><span class="valor" id="horas">—</span><span class="nombre">horas</span></div>
        <div class="dato"><span class="valor" id="minutos">—</span><span class="nombre">minutos</span></div>
      </div>
      <p id="cumple" class="mensaje ok" hidden></p>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
